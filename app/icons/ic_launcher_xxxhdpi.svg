<?xml version="1.0" encoding="UTF-8"?>
<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background with rounded corners for adaptive icon -->
  <rect width="192" height="192" fill="url(#bgGradient)" rx="38.400000000000006" />
  
  <!-- Notification bell icon concept -->
  <g transform="translate(96.0, 96.0)">
    <!-- Bell shape -->
    <path d="M -28.799999999999997 -19.200000000000003 
             Q -28.799999999999997 -48.0 0 -48.0
             Q 28.799999999999997 -48.0 28.799999999999997 -19.200000000000003
             L 28.799999999999997 9.600000000000001
             Q 28.799999999999997 28.799999999999997 0 28.799999999999997
             Q -28.799999999999997 28.799999999999997 -28.799999999999997 9.600000000000001
             Z"
          fill="url(#iconGradient)"
          filter="url(#glow)"
          stroke="#03DAC5"
          stroke-width="2.88" />
    
    <!-- Bell clapper -->
    <circle cx="0" cy="28.799999999999997" r="5.76" fill="#03DAC5" />
    
    <!-- Notification dot (thriller element) -->
    <circle cx="34.56" cy="-38.400000000000006" r="9.600000000000001" fill="#e53935" 
            filter="url(#glow)" />
    
    <!-- Mystery lines (thriller theme) -->
    <line x1="-48.0" y1="-9.600000000000001" x2="-34.56" y2="-9.600000000000001" 
          stroke="#03DAC5" stroke-width="1.92" opacity="0.6" />
    <line x1="34.56" y1="-9.600000000000001" x2="48.0" y2="-9.600000000000001" 
          stroke="#03DAC5" stroke-width="1.92" opacity="0.6" />
  </g>
  
  <!-- Optional: Add subtle text/branding -->
  <text x="96.0" y="163.2" 
        font-family="Arial, sans-serif" 
        font-size="23.04" 
        font-weight="bold"
        fill="#03DAC5" 
        text-anchor="middle"
        opacity="0.4">NT</text>
</svg>