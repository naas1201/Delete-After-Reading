<?xml version="1.0" encoding="UTF-8"?>
<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background with rounded corners for adaptive icon -->
  <rect width="72" height="72" fill="url(#bgGradient)" rx="14.4" />
  
  <!-- Notification bell icon concept -->
  <g transform="translate(36.0, 36.0)">
    <!-- Bell shape -->
    <path d="M -10.799999999999999 -7.2 
             Q -10.799999999999999 -18.0 0 -18.0
             Q 10.799999999999999 -18.0 10.799999999999999 -7.2
             L 10.799999999999999 3.6
             Q 10.799999999999999 10.799999999999999 0 10.799999999999999
             Q -10.799999999999999 10.799999999999999 -10.799999999999999 3.6
             Z"
          fill="url(#iconGradient)"
          filter="url(#glow)"
          stroke="#03DAC5"
          stroke-width="1.08" />
    
    <!-- Bell clapper -->
    <circle cx="0" cy="10.799999999999999" r="2.16" fill="#03DAC5" />
    
    <!-- Notification dot (thriller element) -->
    <circle cx="12.959999999999999" cy="-14.4" r="3.6" fill="#e53935" 
            filter="url(#glow)" />
    
    <!-- Mystery lines (thriller theme) -->
    <line x1="-18.0" y1="-3.6" x2="-12.959999999999999" y2="-3.6" 
          stroke="#03DAC5" stroke-width="0.72" opacity="0.6" />
    <line x1="12.959999999999999" y1="-3.6" x2="18.0" y2="-3.6" 
          stroke="#03DAC5" stroke-width="0.72" opacity="0.6" />
  </g>
  
  <!-- Optional: Add subtle text/branding -->
  <text x="36.0" y="61.199999999999996" 
        font-family="Arial, sans-serif" 
        font-size="8.64" 
        font-weight="bold"
        fill="#03DAC5" 
        text-anchor="middle"
        opacity="0.4">NT</text>
</svg>