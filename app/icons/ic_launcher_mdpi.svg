<?xml version="1.0" encoding="UTF-8"?>
<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background with rounded corners for adaptive icon -->
  <rect width="48" height="48" fill="url(#bgGradient)" rx="9.600000000000001" />
  
  <!-- Notification bell icon concept -->
  <g transform="translate(24.0, 24.0)">
    <!-- Bell shape -->
    <path d="M -7.199999999999999 -4.800000000000001 
             Q -7.199999999999999 -12.0 0 -12.0
             Q 7.199999999999999 -12.0 7.199999999999999 -4.800000000000001
             L 7.199999999999999 2.4000000000000004
             Q 7.199999999999999 7.199999999999999 0 7.199999999999999
             Q -7.199999999999999 7.199999999999999 -7.199999999999999 2.4000000000000004
             Z"
          fill="url(#iconGradient)"
          filter="url(#glow)"
          stroke="#03DAC5"
          stroke-width="0.72" />
    
    <!-- Bell clapper -->
    <circle cx="0" cy="7.199999999999999" r="1.44" fill="#03DAC5" />
    
    <!-- Notification dot (thriller element) -->
    <circle cx="8.64" cy="-9.600000000000001" r="2.4000000000000004" fill="#e53935" 
            filter="url(#glow)" />
    
    <!-- Mystery lines (thriller theme) -->
    <line x1="-12.0" y1="-2.4000000000000004" x2="-8.64" y2="-2.4000000000000004" 
          stroke="#03DAC5" stroke-width="0.48" opacity="0.6" />
    <line x1="8.64" y1="-2.4000000000000004" x2="12.0" y2="-2.4000000000000004" 
          stroke="#03DAC5" stroke-width="0.48" opacity="0.6" />
  </g>
  
  <!-- Optional: Add subtle text/branding -->
  <text x="24.0" y="40.8" 
        font-family="Arial, sans-serif" 
        font-size="5.76" 
        font-weight="bold"
        fill="#03DAC5" 
        text-anchor="middle"
        opacity="0.4">NT</text>
</svg>