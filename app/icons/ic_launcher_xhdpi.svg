<?xml version="1.0" encoding="UTF-8"?>
<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background with rounded corners for adaptive icon -->
  <rect width="96" height="96" fill="url(#bgGradient)" rx="19.200000000000003" />
  
  <!-- Notification bell icon concept -->
  <g transform="translate(48.0, 48.0)">
    <!-- Bell shape -->
    <path d="M -14.399999999999999 -9.600000000000001 
             Q -14.399999999999999 -24.0 0 -24.0
             Q 14.399999999999999 -24.0 14.399999999999999 -9.600000000000001
             L 14.399999999999999 4.800000000000001
             Q 14.399999999999999 14.399999999999999 0 14.399999999999999
             Q -14.399999999999999 14.399999999999999 -14.399999999999999 4.800000000000001
             Z"
          fill="url(#iconGradient)"
          filter="url(#glow)"
          stroke="#03DAC5"
          stroke-width="1.44" />
    
    <!-- Bell clapper -->
    <circle cx="0" cy="14.399999999999999" r="2.88" fill="#03DAC5" />
    
    <!-- Notification dot (thriller element) -->
    <circle cx="17.28" cy="-19.200000000000003" r="4.800000000000001" fill="#e53935" 
            filter="url(#glow)" />
    
    <!-- Mystery lines (thriller theme) -->
    <line x1="-24.0" y1="-4.800000000000001" x2="-17.28" y2="-4.800000000000001" 
          stroke="#03DAC5" stroke-width="0.96" opacity="0.6" />
    <line x1="17.28" y1="-4.800000000000001" x2="24.0" y2="-4.800000000000001" 
          stroke="#03DAC5" stroke-width="0.96" opacity="0.6" />
  </g>
  
  <!-- Optional: Add subtle text/branding -->
  <text x="48.0" y="81.6" 
        font-family="Arial, sans-serif" 
        font-size="11.52" 
        font-weight="bold"
        fill="#03DAC5" 
        text-anchor="middle"
        opacity="0.4">NT</text>
</svg>